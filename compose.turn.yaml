# Three-node TURN cross-allocation smoke test.
#
# inviter-net (172.30.0.0/16): node-b only.
# joiner-net  (172.31.0.0/16): node-a only.
# joiner2-net (172.32.0.0/16): node-c only.
# coturn-net  (172.29.0.0/16): node-a, node-b, node-c, coturn (172.29.0.5).
#
# node-b binds on inviter-net so neither joiner can reach it directly.
# Each node has --turn-server and publishes a relay.addr; bootstrap
# joins land via cross-allocation forwarding (method=relay_via_joiner_turn).
# Post-bootstrap, advertiseSelf on register propagates RelayAddrs
# through the gossip mesh, and node-c dials node-a via the chainDial
# relay rung (method=relay).

services:
  seeder:
    image: busybox:1.37
    volumes:
      - shared-token-turn:/shared
      - node-a-data:/data-a
      - node-b-data:/data-b
      - node-c-data:/data-c
      - backup-a-turn:/backup-a
      - backup-c-turn:/backup-c
    command:
      - sh
      - -c
      - |
        set -eu
        chown -R 65532:65532 /shared /data-a /data-b /data-c /backup-a /backup-c
        echo "prep done: chowned volumes to nonroot"
    restart: "no"

  coturn:
    image: coturn/coturn:4.6.2-r2-alpine
    networks:
      coturn-net:
        ipv4_address: 172.29.0.5
    command:
      - -n
      - --listening-port=3478
      - --listening-ip=172.29.0.5
      - --realm=backupswarm.swarm
      - --lt-cred-mech
      - --user=swarm:s3cret
      - --external-ip=172.29.0.5
      - --relay-ip=172.29.0.5
      - --min-port=49152
      - --max-port=49200
      - --no-tls
      - --no-dtls
      - --no-cli
      - --no-multicast-peers

  node-b:
    build: .
    image: backupswarm:dev
    depends_on:
      seeder:
        condition: service_completed_successfully
      coturn:
        condition: service_started
    volumes:
      - node-b-data:/data
      - shared-token-turn:/shared
    networks:
      inviter-net:
        ipv4_address: 172.30.0.20
      coturn-net:
        ipv4_address: 172.29.0.20
    command:
      - --data-dir
      - /data
      - run
      - --listen
      - 172.30.0.20:7777
      - --invite
      - --token-out
      - /shared/token-a.txt
      - --turn-server
      - 172.29.0.5:3478
      - --turn-user
      - swarm
      - --turn-pass
      - s3cret
      - --turn-realm
      - backupswarm.swarm

  node-a:
    build: .
    image: backupswarm:dev
    depends_on:
      seeder:
        condition: service_completed_successfully
      node-b:
        condition: service_started
    volumes:
      - node-a-data:/data
      - shared-token-turn:/shared
      - backup-a-turn:/backup
    networks:
      joiner-net:
        ipv4_address: 172.31.0.21
      coturn-net:
        ipv4_address: 172.29.0.21
    command:
      - --data-dir
      - /data
      - join
      - --token-file
      - /shared/token-a.txt
      - --timeout
      - 2m
      - --then-run
      - --listen
      - 172.31.0.21:7778
      - --backup-dir
      - /backup
      - --scan-interval
      - 5s
      - --turn-server
      - 172.29.0.5:3478
      - --turn-user
      - swarm
      - --turn-pass
      - s3cret
      - --turn-realm
      - backupswarm.swarm

  inviter-c:
    image: backupswarm:dev
    depends_on:
      node-b:
        condition: service_started
    volumes:
      - node-b-data:/data
      - shared-token-turn:/shared
    command:
      - --data-dir
      - /data
      - invite
      - --wait
      - 30s
      - --token-out
      - /shared/token-c.txt
    restart: "no"

  # Hold node-c back until node-a has connected to node-b and
  # advertiseSelf has populated node-b's peers.db with node-a's
  # RelayAddr; otherwise node-c's PeerListMessage at join time omits it.
  invite-pickup-delay-c:
    image: busybox:1.37
    depends_on:
      inviter-c:
        condition: service_completed_successfully
    command: sh -c "sleep 25"
    restart: "no"

  node-c:
    build: .
    image: backupswarm:dev
    depends_on:
      seeder:
        condition: service_completed_successfully
      invite-pickup-delay-c:
        condition: service_completed_successfully
    volumes:
      - node-c-data:/data
      - shared-token-turn:/shared
      - backup-c-turn:/backup
    networks:
      joiner2-net:
        ipv4_address: 172.32.0.22
      coturn-net:
        ipv4_address: 172.29.0.22
    command:
      - --data-dir
      - /data
      - join
      - --token-file
      - /shared/token-c.txt
      - --timeout
      - 2m
      - --then-run
      - --listen
      - 172.32.0.22:7779
      - --backup-dir
      - /backup
      - --scan-interval
      - 5s
      - --turn-server
      - 172.29.0.5:3478
      - --turn-user
      - swarm
      - --turn-pass
      - s3cret
      - --turn-realm
      - backupswarm.swarm

networks:
  inviter-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16
  joiner-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.0.0/16
  joiner2-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.32.0.0/16
  coturn-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/16

volumes:
  node-a-data:
  node-b-data:
  node-c-data:
  shared-token-turn:
  backup-a-turn:
  backup-c-turn:
